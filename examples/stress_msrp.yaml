---
system:
  cores: 2
  scheduler: RMS
  priority_policy: FIFO
  duration: 0.05

tasks:
  - name: Critical Control
    period: 10ms
    execution: 4ms
    priority: 1
    core_affinity: 0
    max_chunk: 0.5ms

  - name: Heavy IO Worker
    period: 50ms
    execution: 20ms
    priority: 10
    core_affinity: 1
    max_chunk: 8ms # THIS IS THE KILLER: MSRP Spin will be 8ms.
