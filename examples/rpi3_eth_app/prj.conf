# Core Networking Options
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y

# Layer 2 / ARP Management
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y

# Explicitly enable the Intel E1000 Driver for QEMU emulation
CONFIG_ETH_E1000=y

# Network buffer configurations to prevent packet drops
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Updated Logging Structure
CONFIG_NET_LOG=y

# Disable DHCPv4 Client
CONFIG_NET_DHCPV4=n

# Virtual Ethernet Driver Interface for QEMU simulation
CONFIG_NET_QEMU_ETHERNET=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y