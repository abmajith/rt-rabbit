[project]
name = "rt-rabbit"
version = "0.1.0"
description = "Real-time robotics analysis & verification toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cocotb>=2.0.1",
    "cocotb-tools>=0.1.0",
    "cocotbext-wishbone>=2.0.1",
    "matplotlib>=3.10.8",
]
[dependency-groups]
dev = [
    "cocotb-tools>=0.1.0",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
]


[project.scripts]
rma_analysis = "rma_analysis.__main__:main"


[tool.hatch.build.targets.wheel]
packages = ["rma_analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
