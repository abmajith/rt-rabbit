[project]
name = "rt-rabbit"
version = "0.1.0"
description = "Real-time robotics analysis & verification toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
]
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
]


[project.scripts]
rt-rabbit = "rt_rabbit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
