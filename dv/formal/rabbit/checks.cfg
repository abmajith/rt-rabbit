# riscv-formal configuration TEMPLATE for the rabbit cores (see dv/formal/README.md).
# The Makefile fills in @RABBIT_CORE@ for CORE=rabbit3|rabbit5.
#
# [depth] columns: <check>  [start]  [step to check at]   (BMC cycles)
# The first instruction retires 3 (rabbit3) or 5 (rabbit5) cycles after reset.

[options]
isa rv32i

[depth]
insn            12
reg        10   15
pc_fwd     10   15
pc_bwd     10   15
unique     1 10 15
causal     10   15
liveness   1 8  15
ill             12
cover      1    10

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RABBIT_CORE @RABBIT_CORE@

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/core_flat.v

[cover]
# Non-vacuity only: instructions really retire within the check depth, and a
# trap is reachable. The exact timing model and the min/max throughput bounds
# are proven in timing/rabbit_timing_tb.sv, where the solver needs seconds
# (asking riscv-formal's bigger testbench for exact counts took up to 14 min).
always @* if (!reset) cover (channel[0].cnt_insns >= 4);
always @* if (!reset) cover (channel[0].valid && channel[0].trap);
