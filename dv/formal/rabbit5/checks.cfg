# riscv-formal configuration for rabbit5 (see dv/formal/README.md)
#
# [depth] columns: <check>  [start]  [step to check at]   (BMC cycles)
# rabbit5 needs 5 cycles after reset for the first instruction to retire.

[options]
isa rv32i

[depth]
insn            12
reg        10   15
pc_fwd     10   15
pc_bwd     10   15
unique     1 10 15
causal     10   15
liveness   1 10 20
ill             12
cover      1    20

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rabbit5_flat.v

[cover]
# Non-vacuity at cycle 20: full throughput (16 retired: 5..20) and a trap.
# The slowest case (6 retired) and the exact timing model are proven in
# timing/rabbit5_timing_tb.sv, where the solver finds them in seconds.
always @* if (!reset) cover (channel[0].cnt_insns == 16);
always @* if (!reset) cover (channel[0].valid && channel[0].trap);
